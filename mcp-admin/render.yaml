services:
  - type: web
    name: farm-mcp-control
    runtime: node
    rootDir: mcp-admin
    buildCommand: npm install && cd dashboard && npm install && npm run build && cd .. && npm run build
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MCP_SERVER_NAME
        value: farm-mcp-control
      - key: MCP_SERVER_VERSION
        value: 1.0.0
      - key: ADMIN_WRITE_MODE
        value: "false"
      - key: ENABLE_DIAMOND_TOOLS
        value: "false"
      - key: ENABLE_BAN_TOOLS
        value: "false"
      - key: MAX_EXPORT_ROWS
        value: "1000"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: LOG_LEVEL
        value: info
      - key: LOG_RETENTION_DAYS
        value: "30"
      - key: AUDIT_LOG_RETENTION_DAYS
        value: "180"
      - key: MCP_ACCESS_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_OWNER_EMAIL
        value: admin@farmcontrol.com
      - key: BOOTSTRAP_OWNER_PASSWORD
        value: Admin@123456
      - key: BOOTSTRAP_OWNER_NAME
        value: Administrador Principal
